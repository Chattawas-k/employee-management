<div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4" (click)="close.emit()">
  <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl" (click)="$event.stopPropagation()">
    <!-- Header -->
    <header class="p-5 border-b border-gray-200 flex justify-between items-center">
      <h2 class="text-xl font-medium text-gray-900">{{ title }}</h2>
      <button type="button" (click)="close.emit()" class="text-gray-400 hover:text-gray-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </header>

    <!-- Content -->
    <main class="p-5">
      <div class="text-base text-gray-700 leading-relaxed whitespace-pre-line">{{ content }}</div>
    </main>

    <!-- Footer -->
    <footer class="p-4 border-t border-gray-200 flex justify-end items-center">
      <button type="button" (click)="close.emit()" class="px-5 py-2.5 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors">
        ปิด
      </button>
    </footer>
  </div>
</div>
