<div class="fixed inset-0 z-[60] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4" (click)="onCancel(); $event.stopPropagation()">
  <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-gray-200">
      <h2 class="text-xl font-semibold text-gray-900">เพิ่มพนักงานเข้าไปในคิว</h2>
      <button (click)="onCancel(); $event.stopPropagation()" class="text-gray-400 hover: transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Content -->
    <div class="p-6">
      @if (isLoading()) {
        <div class="text-center py-8">
          <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
          <p class="text-gray-500 mt-4">กำลังโหลดข้อมูล...</p>
        </div>
      } @else {
        <!-- Search and Select All -->
        <div class="mb-4">
          <div class="flex items-center gap-2 mb-3">
            <div class="flex-1 relative">
              <input
                type="text"
                [value]="searchText()"
                (input)="onSearchChange($any($event.target).value)"
                placeholder="ค้นหาด้วยชื่อหรือนามสกุล..."
                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
            </div>
            <button
              (click)="toggleSelectAll()"
              [class]="areAllFilteredSelected() ? 'bg-gray-100 text-gray-700 border-gray-300' : 'bg-blue-50 text-blue-600 border-blue-300'"
              class="px-4 py-2 border rounded-lg text-sm font-medium hover:bg-blue-100 transition-colors whitespace-nowrap">
              {{ areAllFilteredSelected() ? 'ยกเลิกทั้งหมด' : 'เลือกทั้งหมด' }}
            </button>
          </div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            เลือกพนักงาน (สามารถเลือกได้หลายคน)
            @if (getSelectedCount() > 0) {
              <span class="text-blue-600 font-normal">(เลือกแล้ว {{ getSelectedCount() }} คน)</span>
            }
          </label>
        </div>

        <!-- Employee Selection -->
        <div class="mb-6">
          <div class="max-h-60 overflow-y-auto border border-gray-200 rounded-lg">
            @if (filteredEmployees().length === 0) {
              <div class="p-4 text-center text-gray-500">
                <p>@if (searchText()) {
                  ไม่พบพนักงานที่ค้นหา
                } @else {
                  ไม่มีพนักงานที่สามารถเพิ่มได้
                }</p>
              </div>
            } @else {
              @for (employee of filteredEmployees(); track employee.id) {
                <button
                  (click)="toggleEmployeeSelection(employee.id)"
                  [class]="isEmployeeSelected(employee.id) ? 'bg-blue-50 border-blue-500' : 'border-transparent hover:bg-gray-50'"
                  class="w-full flex items-center gap-3 p-3 border-l-4 transition-colors text-left">
                  <!-- Checkbox -->
                  <div class="flex-shrink-0">
                    <div [class]="isEmployeeSelected(employee.id) ? 'bg-blue-600 border-blue-600' : 'border-gray-300 bg-white'" 
                         class="w-5 h-5 border-2 rounded flex items-center justify-center">
                      @if (isEmployeeSelected(employee.id)) {
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                      }
                    </div>
                  </div>
                  <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center flex-shrink-0">
                    <span class="text-blue-700 font-semibold">{{ getInitial(employee.name) }}</span>
                  </div>
                  <div class="flex-1 min-w-0">
                    <p class="font-medium text-gray-900">{{ employee.name }}</p>
                    @if (employee.positionName) {
                      <p class="text-sm text-gray-500">{{ employee.positionName }}</p>
                    }
                  </div>
                </button>
              }
            }
          </div>
        </div>
      }
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end gap-3 p-6 border-t border-gray-200">
      <button 
        (click)="onCancel(); $event.stopPropagation()"
        class="px-6 py-2.5 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition-colors">
        ยกเลิก
      </button>
      <button 
        (click)="onAdd(); $event.stopPropagation()"
        [disabled]="getSelectedCount() === 0 || isLoading()"
        class="px-6 py-2.5 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
        เพิ่ม ({{ getSelectedCount() }})
      </button>
    </div>
  </div>
</div>
