<div class="bg-gray-50 rounded-xl p-4">
  <div 
    class="flex justify-between items-center mb-4 px-1"
    [class.cursor-pointer]="isCollapsible"
    (click)="isCollapsible && toggleCollapse()">
    <h3 class="text-base font-medium text-gray-800">{{ title }}</h3>
    <div class="flex items-center gap-2">
      <span class="w-7 h-7 flex items-center justify-center text-sm font-medium text-indigo-700 bg-indigo-100 rounded-full">
        {{ count }}
      </span>
      @if (isCollapsible) {
        <button 
          (click)="$event.stopPropagation(); toggleCollapse()" 
          class="p-1 rounded-full hover:bg-gray-200 focus:outline-none transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 transition-transform duration-200" [class]="isCollapsed() ? '' : 'rotate-180'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
      }
    </div>
  </div>
  @if (!isCollapsed()) {
    <div class="space-y-3">
      @if (isLoading) {
        @for (item of [1, 2, 3]; track item) {
          <div class="bg-white rounded-lg p-3 shadow-sm border border-gray-200 animate-pulse">
            <div class="flex justify-between items-start mb-2">
              <div class="h-5 bg-gray-200 rounded w-32"></div>
              <div class="flex items-center gap-2">
                <div class="h-6 bg-gray-200 rounded w-16"></div>
                <div class="h-6 bg-gray-200 rounded w-16"></div>
              </div>
            </div>
            <div class="flex items-center mb-3">
              <div class="h-4 w-4 bg-gray-200 rounded-full mr-2"></div>
              <div class="h-4 bg-gray-200 rounded w-40"></div>
            </div>
            <div class="h-10 bg-gray-200 rounded-lg"></div>
          </div>
        }
      } @else {
        @for (task of tasks; track task.id) {
          <app-task-card 
            [task]="task" 
            (action)="taskAction.emit($event)"
            (detailClick)="taskDetailClick.emit($event)"></app-task-card>
        }
        @if (tasks.length === 0) {
          <div class="text-center py-10">
            <p class="text-base text-gray-500">ไม่มีงาน</p>
          </div>
        }
      }
    </div>
  }
</div>
