<div class="fixed inset-0 z-50 flex items-center justify-center px-4">
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" (click)="onBackdropClick()"></div>

  <div class="relative w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-100">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="text-lg font-semibold text-slate-900">รับลูกค้า</h3>
          <p class="text-sm text-slate-500 mt-1">ยืนยันเพื่อเริ่มรับลูกค้าทันที</p>
        </div>
        <button type="button" class="p-2 rounded-lg hover:bg-slate-50" (click)="onCancel()" [disabled]="isSubmitting" aria-label="Close">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <div class="p-6">
      <div class="flex items-start gap-4">
        <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
            <circle cx="8.5" cy="7" r="4" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 8v6m3-3h-6" />
          </svg>
        </div>
        <div class="min-w-0">
          <p class="text-base text-slate-800">
            ระบบจะสร้างงานแบบ Walk-in และเริ่มงานให้คุณทันที
          </p>
          <p class="text-sm text-slate-500 mt-1">
            สถานะของคุณจะเปลี่ยนเป็น “ติดลูกค้า”
          </p>
        </div>
      </div>
    </div>

    <div class="px-6 py-4 border-t border-slate-100 flex items-center justify-end gap-3">
      <button
        type="button"
        class="px-4 py-2 rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 font-medium"
        (click)="onCancel()"
        [disabled]="isSubmitting">
        ยกเลิก
      </button>
      <button
        type="button"
        class="px-4 py-2 rounded-lg bg-green-600 text-white hover:bg-green-700 font-medium flex items-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed"
        (click)="onConfirm()"
        [disabled]="isSubmitting">
        @if (isSubmitting) {
          <span class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span>
        }
        <span>ยืนยันรับลูกค้า</span>
      </button>
    </div>
  </div>
</div>
