<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" (click)="onBackdropClick()"></div>

  <div class="relative w-full max-w-lg bg-white rounded-2xl shadow-2xl px-6 py-8">
    <button
      type="button"
      class="absolute right-4 top-4 p-2 rounded-full hover:bg-gray-100 transition-colors"
      (click)="onCancel()"
      [disabled]="isSubmitting"
      aria-label="Close">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <div class="flex flex-col items-center text-center">
      <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mb-5">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
          <circle cx="8.5" cy="7" r="4" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 8v6m3-3h-6" />
        </svg>
      </div>

      <h2 class="text-2xl font-semibold text-gray-900">รับลูกค้า?</h2>
      <p class="mt-2 text-sm text-gray-500">
        ระบบจะสร้างงานแบบ Walk-in และเริ่มงานให้คุณทันที (สถานะจะเปลี่ยนเป็น “ติดลูกค้า”)
      </p>

      <div class="mt-8 grid grid-cols-2 gap-3 w-full">
        <button
          type="button"
          class="w-full py-3 border border-gray-300 rounded-xl bg-white font-medium text-gray-700 hover:bg-gray-50 transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
          (click)="onCancel()"
          [disabled]="isSubmitting">
          ยกเลิก
        </button>
        <button
          type="button"
          class="w-full py-3 rounded-xl font-medium shadow-sm transition-colors bg-green-600 hover:bg-green-700 text-white flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed"
          (click)="onConfirm()"
          [disabled]="isSubmitting">
          @if (isSubmitting) {
            <span class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span>
          }
          <span>ยืนยันและเริ่มงาน</span>
        </button>
      </div>
    </div>
  </div>
</div>
