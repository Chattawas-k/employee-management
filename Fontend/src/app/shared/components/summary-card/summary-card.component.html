<div class="bg-white rounded-xl px-3 py-2 flex items-center gap-4 shadow-md" [class]="containerClass">

  <div class="w-14 h-14 rounded-lg flex items-center justify-center" [class]="iconBgClass">
    @switch (icon) {
      @case ('check') {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" [class]="iconClass" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      }
      @case ('pulse') {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" [class]="iconClass" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h3l2.25-6L12 16.5l2.25-9L17.25 12h3" />
        </svg>
      }
      @case ('user-check') {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" [class]="iconClass" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.25 10.5l-3.75 3.75-1.5-1.5" transform="translate(4, 4)" />
        </svg>
      }
      @case ('clipboard') {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" [class]="iconClass" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5a2 2 0 002 2h2a2 2 0 002-2" />
        </svg>
      }
      @case ('clock') {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" [class]="iconClass" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" />
        </svg>
      }
      @case ('x-circle') {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" [class]="iconClass" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2 2 2m-4-4l2 2 2-2" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" />
        </svg>
      }
      @case ('check-circle') {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" [class]="iconClass" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      }
      @case ('chart-bar') {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" [class]="iconClass" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" />
        </svg>
      }
      @case ('trending-up') {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" [class]="iconClass" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
        </svg>
      }
    }
  </div>
  <div class="flex flex-col gap-1">
    <p class="text-gray-500 ">{{ title }}</p>
    <div class="flex items-baseline">
      <span class="font-medium" [class]="valueClass">{{ value }}</span>
      <span class="ml-2 font-medium">{{ unit }}</span>
    </div>
  </div>
</div>
