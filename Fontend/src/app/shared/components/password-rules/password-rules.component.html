<div class="rounded-2xl border border-gray-200 bg-white p-4 shadow-sm">
  <p class="text-sm font-semibold text-gray-900 mb-3">เงื่อนไขรหัสผ่าน</p>
  <ul class="space-y-2">
    @for (rule of rules(); track rule.key) {
      <li class="flex items-start gap-2 text-sm">
        <span
          class="mt-0.5 inline-flex h-5 w-5 items-center justify-center rounded-full border"
          [class]="rule.passed
            ? 'bg-green-50 border-green-200 text-green-700'
            : 'bg-gray-50 border-gray-200 text-gray-500'">
          @if (rule.passed) {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-10.707a1 1 0 00-1.414-1.414L10 8.172 7.707 5.879a1 1 0 10-1.414 1.414L8.586 9.586l-2.293 2.293a1 1 0 101.414 1.414L10 11l2.293 2.293a1 1 0 001.414-1.414L11.414 9.586l2.293-2.293z" clip-rule="evenodd" />
            </svg>
          }
        </span>
        <span [class]="rule.passed ? 'text-green-800' : 'text-gray-700'">{{ rule.label }}</span>
      </li>
    }
  </ul>
</div>
