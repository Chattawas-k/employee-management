<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" (click)="close.emit()"></div>

  <div class="relative w-full max-w-lg bg-white rounded-2xl shadow-2xl px-6 py-8" (click)="$event.stopPropagation()">
    <button
      type="button"
      class="absolute right-4 top-4 p-2 rounded-full hover:bg-gray-100 transition-colors"
      (click)="close.emit()"
      aria-label="Close">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <div class="flex flex-col items-center text-center">
      <div class="w-16 h-16 rounded-full flex items-center justify-center mb-5" [class]="getIconBgClass()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" [class]="getIconTextClass()" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
        </svg>
      </div>

      <h2 class="text-2xl font-semibold text-gray-900">ยืนยันการเปลี่ยนสถานะ</h2>
      <p class="mt-2 text-sm text-gray-500">
        คุณต้องการเปลี่ยนสถานะจาก <span class="font-semibold text-gray-900">"{{ getStatusLabel(currentStatus) }}"</span>
        เป็น <span class="font-semibold text-gray-900">"{{ getStatusLabel(newStatus) }}"</span> ใช่หรือไม่?
      </p>

      <div class="mt-8 grid grid-cols-2 gap-3 w-full">
        <button
          type="button"
          (click)="cancel.emit()"
          class="w-full py-3 border border-gray-300 rounded-xl bg-white font-medium text-gray-700 hover:bg-gray-50 transition-colors">
          ยกเลิก
        </button>
        <button
          type="button"
          (click)="confirm.emit()"
          class="w-full py-3 rounded-xl font-medium shadow-sm transition-colors bg-blue-600 hover:bg-blue-700 text-white">
          ยืนยัน
        </button>
      </div>
    </div>
  </div>
</div>
