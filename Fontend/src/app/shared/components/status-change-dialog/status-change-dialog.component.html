<div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4" (click)="close.emit()">
  <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl" (click)="$event.stopPropagation()">
    <header class="flex justify-end mb-2">
      <button (click)="close.emit()" class="text-gray-400 hover: transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </header>
    
    <main class="px-2 pb-4">
      <div class="mx-auto w-16 h-16 rounded-full flex items-center justify-center mb-4" [class]="getIconBgClass()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9" [class]="getIconTextClass()" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
        </svg>
      </div>
      
      <h2 class="text-2xl font-medium text-gray-900 mb-4 text-center">ยืนยันการเปลี่ยนสถานะ</h2>
      <p class="text-base  mb-8 text-center">
        คุณต้องการเปลี่ยนสถานะจาก <span class="font-semibold text-gray-900">"{{ getStatusLabel(currentStatus) }}"</span> เป็น <span class="font-semibold text-gray-900">"{{ getStatusLabel(newStatus) }}"</span> ใช่หรือไม่?
      </p>
      
      <div class="grid grid-cols-2 gap-4">
        <button (click)="cancel.emit()" class="w-full py-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors bg-white font-medium text-gray-700">
          ยกเลิก
        </button>
        <button (click)="confirm.emit()" class="w-full py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium shadow-sm">
          ยืนยัน
        </button>
      </div>
    </main>
  </div>
</div>
