<div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4" (click)="onClose()">
  <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl" (click)="$event.stopPropagation()">
    <header class="p-5 border-b border-gray-200 flex justify-between items-center">
      <h2 class="text-xl font-medium ">ยกเลิก Ticket</h2>
      <button (click)="onClose()" class="text-gray-400 hover:">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </header>

    <main class="p-5 space-y-4">
      <div>
        <p class="text-sm  mb-2">งาน: <span class="font-medium text-gray-900">{{ jobNumber }}</span></p>
        <p class="text-sm text-red-600">คุณแน่ใจหรือไม่ว่าต้องการยกเลิกงานนี้?</p>
      </div>

      <form [formGroup]="cancelForm" (ngSubmit)="onConfirm()">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">เหตุผลในการยกเลิก *</label>
          <textarea
            formControlName="reason"
            rows="3"
            placeholder="ระบุเหตุผลในการยกเลิก..."
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent resize-none"></textarea>
          @if (cancelForm.get('reason')?.invalid && cancelForm.get('reason')?.touched) {
            <p class="mt-1 text-xs text-red-600">กรุณาระบุเหตุผล</p>
          }
        </div>

        <div class="flex items-center justify-end gap-3 mt-6">
          <button
            type="button"
            (click)="onClose()"
            class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
            ยกเลิก
          </button>
          <button
            type="submit"
            [disabled]="cancelForm.invalid"
            class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors">
            ยืนยันการยกเลิก
          </button>
        </div>
      </form>
    </main>
  </div>
</div>
