@if (shouldRender) {
<div class="p-4 border-l-4 rounded-r-xl flex items-center gap-4 shadow-sm mb-6" [class]="containerClass">
  <div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center border-2" [class]="iconWrapClass">
    @switch (resolvedIcon) {
      @case ('bell') {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" [class]="iconClass" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
      }
      @case ('user-plus') {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" [class]="iconClass" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
        </svg>
      }
      @case ('ban') {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" [class]="iconClass" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
        </svg>
      }
      @case ('pause') {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" [class]="iconClass" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 9v6m4-6v6" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" />
        </svg>
      }
      @case ('check') {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" [class]="iconClass" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" />
        </svg>
      }
      @case ('info') {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" [class]="iconClass" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" />
        </svg>
      }
    }
  </div>

  <div class="flex-1 min-w-0">
    <h2 class="text-lg font-medium ">{{ resolvedTitle }}</h2>
    <p class="text-sm text-gray-700">{{ resolvedSubtitle }}</p>
  </div>

  @if (resolvedActionLabel) {
    <button
      type="button"
      (click)="onActionClick()"
      class="flex-shrink-0 flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-medium rounded-xl shadow-md hover:shadow-lg transition-all duration-300"
      [class]="resolvedActionButtonClass">
      @if (resolvedActionIcon) {
        @switch (resolvedActionIcon) {
          @case ('user-plus') {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
            </svg>
          }
          @case ('check') {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          }
          @case ('bell') {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
          }
          @default {
            <span></span>
          }
        }
      }
      <span>{{ resolvedActionLabel }}</span>
    </button>
  }
</div>
}
