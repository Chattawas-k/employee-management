@if (staff) {
<div class="bg-white rounded-2xl shadow-lg p-6 flex flex-col transition-all duration-300 hover:shadow-2xl hover:-translate-y-1 h-full">
  <div class="flex items-start justify-between">
    <div class="flex items-center gap-4">
      <img [src]="staff.avatarUrl" [alt]="staff.name" class="w-14 h-14 rounded-full object-cover border-2 border-white shadow-md">
      <div>
        <h3 class="text-lg font-medium text-gray-800">{{ staff.name }}</h3>
        <p class="text-base text-gray-500">{{ staff.role }}</p>
      </div>
    </div>
    <span class="px-3 py-1 text-sm font-medium rounded-full flex-shrink-0" [class]="staff.statusClass">
      {{ staff.status }}
    </span>
  </div>

  <div class="flex flex-row sm:grid sm:grid-cols-4 gap-0 sm:gap-4 my-4 sm:my-6 flex-grow bg-gray-50 p-2 sm:p-4 rounded-lg overflow-x-auto">
    <div class="text-center flex-1 sm:flex-none min-w-0 px-1 sm:px-2">
      <p class="text-[10px] sm:text-xs text-gray-500 whitespace-nowrap mb-0.5 sm:mb-1 leading-tight">งานที่ต้องทำ</p>
      <p class="font-medium text-gray-800 text-[11px] sm:text-2xl leading-tight">{{ staff.pendingTasks }}</p>
    </div>
    <div class="text-center border-l border-r border-gray-200 flex-1 sm:flex-none min-w-0 px-1 sm:px-2">
      <p class="text-[10px] sm:text-xs text-gray-500 whitespace-nowrap mb-0.5 sm:mb-1 leading-tight">งานที่ทำอยู่</p>
      <p class="font-medium text-gray-800 text-[11px] sm:text-2xl leading-tight">{{ staff.currentTasks }}</p>
    </div>
    <div class="text-center border-r border-gray-200 flex-1 sm:flex-none min-w-0 px-1 sm:px-2">
      <p class="text-[10px] sm:text-xs text-gray-500 whitespace-nowrap mb-0.5 sm:mb-1 leading-tight">งานทั้งหมด</p>
      <p class="font-medium text-gray-800 text-[11px] sm:text-2xl leading-tight">{{ staff.totalTasks }}</p>
    </div>
    <div class="text-center flex-1 sm:flex-none min-w-0 px-1 sm:px-2">
      <p class="text-[10px] sm:text-xs text-gray-500 whitespace-nowrap mb-0.5 sm:mb-1 leading-tight">ลำดับคิว</p>
      <p class="font-medium text-gray-800 text-[11px] sm:text-2xl leading-tight">
        @if (staff.queuePosition > 0) {
          #{{ staff.queuePosition }}
        } @else {
          <span class="text-gray-400">-</span>
        }
      </p>
    </div>
  </div>

  <button 
    (click)="onActionClick()"
    [disabled]="staff.status !== 'พร้อมรับงาน'"
    class="w-full mt-auto flex items-center justify-center gap-2 px-4 py-3 text-base font-medium rounded-lg transition-all duration-200 bg-indigo-600 text-white shadow-md hover:bg-indigo-700 hover:shadow-lg hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:bg-gray-300 disabled:shadow-none disabled:cursor-not-allowed disabled:opacity-70">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <span>รับลูกค้า</span>
  </button>
</div>
}
