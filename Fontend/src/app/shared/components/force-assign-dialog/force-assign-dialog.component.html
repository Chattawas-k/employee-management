<div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4" (click)="onClose()">
  <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl" (click)="$event.stopPropagation()">
    <header class="p-5 border-b border-gray-200 flex justify-between items-center">
      <h2 class="text-xl font-medium ">Force Assign</h2>
      <button (click)="onClose()" class="text-gray-400 hover:">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </header>

    <main class="p-5 space-y-4">
      <div>
        <p class="text-sm  mb-2">งาน: <span class="font-medium text-gray-900">{{ jobNumber }}</span></p>
        @if (currentAssignee) {
          <p class="text-sm ">ผู้รับผิดชอบปัจจุบัน: <span class="font-medium text-gray-900">{{ currentAssignee }}</span></p>
        }
      </div>

      <form [formGroup]="assignForm" (ngSubmit)="onConfirm()">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">มอบหมายให้ *</label>
            @if (isLoadingStaff) {
              <div class="px-3 py-2 border border-gray-300 rounded-lg bg-gray-50">
                <p class="text-sm text-gray-500">กำลังโหลด...</p>
              </div>
            } @else {
              <select
                formControlName="staffId"
                class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="">เลือกทีมงาน</option>
                @for (staff of staffOptions; track staff.id) {
                  <option [value]="staff.id">{{ staff.name }}</option>
                }
              </select>
            }
            @if (assignForm.get('staffId')?.invalid && assignForm.get('staffId')?.touched) {
              <p class="mt-1 text-xs text-red-600">กรุณาเลือกทีมงาน</p>
            }
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">เหตุผล (ไม่บังคับ)</label>
            <textarea
              formControlName="reason"
              rows="3"
              placeholder="ระบุเหตุผลในการ Force Assign..."
              class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"></textarea>
          </div>
        </div>

        <div class="flex items-center justify-end gap-3 mt-6">
          <button
            type="button"
            (click)="onClose()"
            class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
            ยกเลิก
          </button>
          <button
            type="submit"
            [disabled]="assignForm.invalid"
            class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors">
            ยืนยัน
          </button>
        </div>
      </form>
    </main>
  </div>
</div>
