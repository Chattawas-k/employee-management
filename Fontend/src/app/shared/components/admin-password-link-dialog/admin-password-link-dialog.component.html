@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50" (click)="onClose()">
    <div class="bg-white rounded-2xl shadow-sm w-full max-w-xl mx-4" (click)="$event.stopPropagation()">
      <div class="flex items-center justify-between p-6 border-b border-gray-200">
        <h2 class="text-xl font-semibold text-gray-900">{{ title }}</h2>
        <button (click)="onClose()" class="text-gray-400 hover:text-gray-600 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="p-6 space-y-4">
        <div class="rounded-2xl bg-indigo-50 border border-indigo-100 p-4 text-sm text-indigo-900">
          <p class="font-semibold mb-1">หมายเหตุ</p>
          <p>ลิงก์มีอายุ {{ ttlMinutes }} นาที และใช้ได้ 1 ครั้ง</p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">ลิงก์</label>
          <div class="flex gap-2">
            <input
              [value]="linkUrl"
              readonly
              class="flex-1 px-4 py-3 border border-gray-300 rounded-2xl text-sm bg-gray-50 focus:outline-none" />
            <button
              type="button"
              (click)="copy()"
              [disabled]="isCopying() || !linkUrl"
              class="px-4 py-3 rounded-2xl bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors">
              {{ isCopying() ? 'กำลังคัดลอก...' : 'คัดลอก' }}
            </button>
          </div>
        </div>

        @if (expiresAt) {
          <p class="text-xs text-gray-500">หมดอายุ: {{ expiresAt }}</p>
        }
      </div>

      <div class="p-6 pt-0">
        <button type="button"
          class="w-full px-4 py-3 rounded-2xl border border-gray-300 text-gray-700 font-medium hover:bg-gray-50 transition-colors"
          (click)="onClose()">
          ปิด
        </button>
      </div>
    </div>
  </div>
}
