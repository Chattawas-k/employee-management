@if (dialog(); as d) {
  <div class="fixed inset-0 z-[60] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" (click)="onBackdropClick()"></div>

    <div class="relative w-full max-w-lg bg-white rounded-2xl shadow-2xl px-6 py-8">
      <button
        type="button"
        class="absolute right-4 top-4 p-2 rounded-full hover:bg-gray-100 transition-colors"
        (click)="onClose()"
        aria-label="Close">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <div class="flex flex-col items-center text-center">
        <div class="w-16 h-16 rounded-full flex items-center justify-center mb-5" [class]="getIconBgClass(getTone(d))">
          <app-icon [name]="d.iconName || 'help-circle'" [className]="'w-8 h-8 ' + getIconTextClass(getTone(d))"></app-icon>
        </div>

        <h2 class="text-2xl font-semibold text-gray-900">{{ d.title }}</h2>
        @if (d.message) {
          <p class="mt-2 text-sm text-gray-500">{{ d.message }}</p>
        }

        <div class="mt-8 grid grid-cols-2 gap-3 w-full">
          <button
            type="button"
            class="w-full py-3 border border-gray-300 rounded-xl bg-white font-medium text-gray-700 hover:bg-gray-50 transition-colors"
            (click)="onCancel()">
            {{ d.cancelText || 'ยกเลิก' }}
          </button>
          <button
            type="button"
            class="w-full py-3 rounded-xl font-medium shadow-sm transition-colors"
            [class]="getConfirmButtonClass(getTone(d))"
            (click)="onConfirm()">
            {{ d.confirmText || 'ยืนยัน' }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
