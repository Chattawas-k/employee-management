<div class="flex flex-col min-h-screen bg-gray-100">

  <div class="bg-white px-4 sm:px-8 lg:py-6">
    <!-- Header -->
    <header class="flex flex-col gap-4 sm:flex-row sm:justify-between sm:items-center pb-6">
      <div class="flex items-center gap-4">
        <div>
          <h1 class="text-4xl font-medium text-blue-600">งานของฉัน</h1>
        </div>
      </div>
    </header>
    <app-callout-card preset="queue" [availabilityStatus]="availabilityStatus()" [isMyTurn]="isMyTurn()" [queuesRemaining]="queueInfo()?.queuesRemaining ?? null"
      queueActionLabel="รับลูกค้า" queueActionIcon="user-plus"
      queueActionButtonClass="bg-green-600 hover:bg-green-700 text-white" (action)="acceptCustomer()" />
  </div>

  <main class="px-4 sm:px-8 py-8">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <app-task-column title="งานที่ต้องทำ (รอดำเนินการ)" [count]="todoTasks().length" [tasks]="todoTasks()"
        [isLoading]="isLoading()" (taskAction)="handleTaskAction($event)" (taskDetailClick)="showTaskDetails($event)">
      </app-task-column>
      <app-task-column title="กำลังดำเนินการ" [count]="inProgressTasks().length" [tasks]="inProgressTasks()"
        [isLoading]="isLoading()" (taskAction)="handleTaskAction($event)" (taskDetailClick)="showTaskDetails($event)">
      </app-task-column>
      <app-task-column title="ประวัติ (เสร็จสิ้น)" [count]="completedTasks().length" [tasks]="completedTasks()"
        [isCollapsible]="true" [isLoading]="isLoading()" (taskAction)="handleTaskAction($event)"
        (taskDetailClick)="showTaskDetails($event)">
      </app-task-column>
    </div>
  </main>

  @if (showStartDialog() && selectedTask()) {
  <app-confirmation-dialog [task]="selectedTask()!" (confirm)="handleStartTaskConfirmation()"
    (reject)="handleRejectTask()" (close)="closeStartDialog()">
  </app-confirmation-dialog>
  }

  @if (showRejectDialog() && selectedTask()) {
  <app-reject-task-dialog [task]="selectedTask()!" (close)="closeRejectDialog()" (confirm)="confirmRejectTask($event)">
  </app-reject-task-dialog>
  }

  @if (showSalesReportDialog() && selectedTask()) {
  <app-sales-report-dialog [task]="selectedTask()!" (save)="confirmCompleteTask($event)"
    (close)="closeSalesReportDialog()">
  </app-sales-report-dialog>
  }

  @if (showTaskDetailDialog() && selectedTask()) {
  <app-task-detail-dialog [task]="selectedTask()!" (close)="closeTaskDetailDialog()">
  </app-task-detail-dialog>
  }

</div>
