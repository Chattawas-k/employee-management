<div class="flex-1 p-4 sm:p-6 lg:p-8 bg-slate-50 min-w-0" style="box-sizing: border-box; width: 100%; max-width: 100%; overflow-x: hidden; overflow-y: auto;">
  <header class="flex flex-col gap-4 sm:flex-row sm:justify-between sm:items-center pb-6">
    <div class="flex items-center gap-4">
      <div>
        <h1 class="text-3xl font-medium text-gray-900">มอบหมายงาน (Job Assignment)</h1>
      </div>
    </div>
    <div class="relative w-full sm:w-64">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
      <input 
        type="text" 
        [(ngModel)]="searchTerm"
        placeholder="ค้นหาพนักงาน..." 
        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
      >
    </div>
  </header>

  <!-- Status Tabs -->
  <div class="mb-4 sm:mb-6 border-b border-gray-200 relative w-full min-w-0 overflow-hidden" style="box-sizing: border-box; width: 100%; max-width: 100%;">
    <!-- Left Scroll Indicator -->
    <button 
      *ngIf="showLeftScroll()"
      (click)="scrollLeft()"
      class="absolute left-0 top-0 bottom-0 z-10 w-12 bg-gradient-to-r from-slate-50 via-slate-50/80 to-transparent flex items-center justify-center hover:from-slate-100 transition-all duration-200 pointer-events-auto"
      type="button"
      aria-label="Scroll left">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
    </button>
    
    <!-- Right Scroll Indicator -->
    <button 
      *ngIf="showRightScroll()"
      (click)="scrollRight()"
      class="absolute right-0 top-0 bottom-0 z-10 w-12 bg-gradient-to-l from-slate-50 via-slate-50/80 to-transparent flex items-center justify-center hover:from-slate-100 transition-all duration-200 pointer-events-auto"
      type="button"
      aria-label="Scroll right">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
    </button>
    
    <nav 
      #tabsNav
      class="-mb-px flex space-x-3 sm:space-x-6 md:space-x-8 overflow-x-auto scrollbar-hide min-w-0" 
      aria-label="Tabs" 
      style="-webkit-overflow-scrolling: touch; box-sizing: border-box; width: 100%; max-width: 100%; scroll-behavior: smooth; overflow-x: auto;"
      (scroll)="onTabsScroll()">
      <button
        (click)="setTab('all')"
        [class]="activeTab() === 'all' 
          ? 'border-indigo-500 text-indigo-600' 
          : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
        class="whitespace-nowrap py-3 sm:py-4 px-2 sm:px-1 border-b-2 font-medium text-xs sm:text-sm transition-colors duration-200 flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
        <span>ทั้งหมด</span>
        <span [class]="activeTab() === 'all' 
          ? 'bg-indigo-100 text-indigo-600' 
          : 'bg-gray-100 text-gray-600'"
          class="px-1.5 sm:px-2 py-0.5 rounded-full text-xs font-semibold">
          {{ staffCounts().all }}
        </span>
      </button>
      
      <button
        (click)="setTab('available')"
        [class]="activeTab() === 'available' 
          ? 'border-green-500 text-green-600' 
          : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
        class="whitespace-nowrap py-3 sm:py-4 px-2 sm:px-1 border-b-2 font-medium text-xs sm:text-sm transition-colors duration-200 flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
        <span class="w-2 h-2 rounded-full bg-green-500"></span>
        <span>พร้อมรับงาน</span>
        <span [class]="activeTab() === 'available' 
          ? 'bg-green-100 text-green-600' 
          : 'bg-gray-100 text-gray-600'"
          class="px-1.5 sm:px-2 py-0.5 rounded-full text-xs font-semibold">
          {{ staffCounts().available }}
        </span>
      </button>
      
      <button
        (click)="setTab('busy')"
        [class]="activeTab() === 'busy' 
          ? 'border-orange-500 text-orange-600' 
          : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
        class="whitespace-nowrap py-3 sm:py-4 px-2 sm:px-1 border-b-2 font-medium text-xs sm:text-sm transition-colors duration-200 flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
        <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-orange-500 flex-shrink-0"></span>
        <span>ติดลูกค้า</span>
        <span [class]="activeTab() === 'busy' 
          ? 'bg-orange-100 text-orange-600' 
          : 'bg-gray-100 text-gray-600'"
          class="px-1.5 sm:px-2 py-0.5 rounded-full text-xs font-semibold">
          {{ staffCounts().busy }}
        </span>
      </button>
      
      <button
        (click)="setTab('lunchBreak')"
        [class]="activeTab() === 'lunchBreak' 
          ? 'border-yellow-500 text-yellow-600' 
          : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
        class="whitespace-nowrap py-3 sm:py-4 px-2 sm:px-1 border-b-2 font-medium text-xs sm:text-sm transition-colors duration-200 flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
        <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-yellow-500 flex-shrink-0"></span>
        <span>พักเที่ยง</span>
        <span [class]="activeTab() === 'lunchBreak' 
          ? 'bg-yellow-100 text-yellow-600' 
          : 'bg-gray-100 text-gray-600'"
          class="px-1.5 sm:px-2 py-0.5 rounded-full text-xs font-semibold">
          {{ staffCounts().lunchBreak }}
        </span>
      </button>
      
      <button
        (click)="setTab('unavailable')"
        [class]="activeTab() === 'unavailable' 
          ? 'border-gray-500 text-gray-600' 
          : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
        class="whitespace-nowrap py-3 sm:py-4 px-2 sm:px-1 border-b-2 font-medium text-xs sm:text-sm transition-colors duration-200 flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
        <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-gray-500 flex-shrink-0"></span>
        <span>ไม่พร้อมรับงาน</span>
        <span [class]="activeTab() === 'unavailable' 
          ? 'bg-gray-100 text-gray-600' 
          : 'bg-gray-100 text-gray-600'"
          class="px-1.5 sm:px-2 py-0.5 rounded-full text-xs font-semibold">
          {{ staffCounts().unavailable }}
        </span>
      </button>
      
      <button
        (click)="setTab('leave')"
        [class]="activeTab() === 'leave' 
          ? 'border-red-500 text-red-600' 
          : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
        class="whitespace-nowrap py-3 sm:py-4 px-2 sm:px-1 border-b-2 font-medium text-xs sm:text-sm transition-colors duration-200 flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
        <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-red-500 flex-shrink-0"></span>
        <span>ลา</span>
        <span [class]="activeTab() === 'leave' 
          ? 'bg-red-100 text-red-600' 
          : 'bg-gray-100 text-gray-600'"
          class="px-1.5 sm:px-2 py-0.5 rounded-full text-xs font-semibold">
          {{ staffCounts().leave }}
        </span>
      </button>

      <button
        (click)="setTab('offsiteCustomer')"
        [class]="activeTab() === 'offsiteCustomer' 
          ? 'border-blue-500 text-blue-600' 
          : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
        class="whitespace-nowrap py-3 sm:py-4 px-2 sm:px-1 border-b-2 font-medium text-xs sm:text-sm transition-colors duration-200 flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
        <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-blue-500 flex-shrink-0"></span>
        <span>พบลูกค้านอกสถานที่</span>
        <span [class]="activeTab() === 'offsiteCustomer' 
          ? 'bg-blue-100 text-blue-600' 
          : 'bg-gray-100 text-gray-600'"
          class="px-1.5 sm:px-2 py-0.5 rounded-full text-xs font-semibold">
          {{ staffCounts().offsiteCustomer }}
        </span>
      </button>
    </nav>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
    @if (isLoading()) {
      @for (i of [1,2,3,4,5,6]; track i) {
        <div class="bg-white rounded-2xl shadow-lg p-6 flex flex-col h-full animate-pulse">
          <div class="flex items-start justify-between">
            <div class="flex items-center gap-4">
              <div class="w-14 h-14 rounded-full bg-gray-200"></div>
              <div>
                <div class="h-4 bg-gray-200 rounded w-32 mb-2"></div>
                <div class="h-3 bg-gray-200 rounded w-24"></div>
              </div>
            </div>
            <div class="h-6 bg-gray-200 rounded-full w-20"></div>
          </div>
          <div class="grid grid-cols-2 gap-4 my-6 flex-grow bg-gray-50 p-4 rounded-lg">
            <div class="text-center">
              <div class="h-3 bg-gray-200 rounded w-20 mx-auto mb-2"></div>
              <div class="h-8 bg-gray-200 rounded w-12 mx-auto"></div>
            </div>
            <div class="text-center border-l border-gray-200">
              <div class="h-3 bg-gray-200 rounded w-20 mx-auto mb-2"></div>
              <div class="h-8 bg-gray-200 rounded w-12 mx-auto"></div>
            </div>
          </div>
          <div class="h-10 bg-gray-200 rounded-lg w-full"></div>
        </div>
      }
    } @else {
      @for(staff of filteredStaff(); track staff.name) {
        <app-job-assignment-card [staff]="staff" (action)="handleAction($event)"></app-job-assignment-card>
      }
    }
  </div>

  @if(!isLoading() && filteredStaff().length === 0) {
    <div class="text-center py-16">
      <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      <h3 class="mt-2 text-base font-medium text-gray-900">ไม่พบพนักงาน</h3>
      <p class="mt-1 text-base text-gray-500">ลองปรับเปลี่ยนคำค้นหาของคุณ</p>
    </div>
  }
</div>

@if (showAssignDialog() && selectedStaff()) {
  <app-open-job-dialog
    [userName]="selectedStaff()!.name"
    (close)="closeAssignDialog()"
    (confirm)="confirmAssignment($event)">
  </app-open-job-dialog>
}
