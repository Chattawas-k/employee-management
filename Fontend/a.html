<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Queue Monitor: Cinematic Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Prompt:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Theme: Deep Space & Cyber Blue */
            --bg-deep: #02040a;
            --bg-surface: #0f172a;
            --primary-accent: #06b6d4; /* Cyan */
            --success-accent: #10b981; /* Emerald */
            --warning-accent: #f59e0b; /* Amber */
            
            --glass-bg: rgba(10, 15, 30, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shine: rgba(255, 255, 255, 0.05);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            /* Orb Colors - Dark Mode */
            --orb-1-color: rgba(6, 182, 212, 0.15);
            --orb-2-color: rgba(99, 102, 241, 0.15);
            --orb-3-color: rgba(16, 185, 129, 0.1);
        }

        body.light-mode {
            /* Theme: Ethereal Day (Premium White/Pastel) */
            --bg-deep: #f8fafc; /* Slate 50 */
            --bg-surface: #ffffff;
            --primary-accent: #0284c7; /* Sky Blue 600 */
            
            /* Frosted White Glass */
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.9);
            --glass-shine: rgba(255, 255, 255, 0.8);
            
            --text-main: #1e293b; /* Slate 800 */
            --text-muted: #64748b; /* Slate 500 */

            /* Orb Colors - Light Mode (Pastel) */
            --orb-1-color: rgba(14, 165, 233, 0.25); /* Sky Blue */
            --orb-2-color: rgba(168, 85, 247, 0.2); /* Soft Purple */
            --orb-3-color: rgba(20, 184, 166, 0.2); /* Teal */
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            overflow: hidden;
            transition: background-color 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* --- ADVANCED BACKGROUND FX --- */
        .bg-fixed-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            /* Light mode gradient base */
            transition: background 0.8s ease;
        }

        body.light-mode .bg-fixed-layer {
            background: linear-gradient(135deg, #f0f9ff 0%, #eef2ff 50%, #f0fdf4 100%);
        }

        /* Animated Aurora Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: drift 20s infinite alternate ease-in-out;
            will-change: transform;
            transition: background 0.8s ease;
        }

        .orb-1 {
            width: 60vw; height: 60vw;
            background: radial-gradient(circle, var(--orb-1-color), transparent 70%);
            top: -10%; left: -10%;
            animation-delay: 0s;
        }
        
        .orb-2 {
            width: 50vw; height: 50vw;
            background: radial-gradient(circle, var(--orb-2-color), transparent 70%);
            bottom: -10%; right: -10%;
            animation-delay: -5s;
            animation-duration: 25s;
        }

        .orb-3 {
            width: 40vw; height: 40vw;
            background: radial-gradient(circle, var(--orb-3-color), transparent 70%);
            top: 40%; left: 30%;
            animation-delay: -10s;
            animation-duration: 30s;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
            100% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* Cyber Grid Pattern */
        .cyber-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.5;
            z-index: 1;
            transition: all 0.5s ease;
        }
        
        body.light-mode .cyber-grid {
            background-image: 
                linear-gradient(rgba(148, 163, 184, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.1) 1px, transparent 1px);
            opacity: 0.8;
        }

        /* Hexagon Pattern Overlay */
        .hex-pattern {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='24' height='40' viewBox='0 0 24 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,40 L0,34 L5,31 L10,34 L10,40 L12,40 L12,32.8 L5,28.8 L-2,32.8 L-2,40 L0,40 Z M0,0 L0,6 L5,9 L10,6 L10,0 L12,0 L12,7.2 L5,11.2 L-2,7.2 L-2,0 L0,0 Z M12,40 L12,34 L17,31 L22,34 L22,40 L24,40 L24,32.8 L17,28.8 L10,32.8 L10,40 L12,40 Z M12,0 L12,6 L17,9 L22,6 L22,0 L24,0 L24,7.2 L17,11.2 L10,7.2 L10,0 L12,0 Z M24,20 L24,14 L19,11 L14,14 L14,20 L12,20 L12,12.8 L19,8.8 L26,12.8 L26,20 L24,20 Z M24,20 L24,26 L19,29 L14,26 L14,20 L12,20 L12,27.2 L19,31.2 L26,27.2 L26,20 L24,20 Z M0,20 L0,14 L5,11 L10,14 L10,20 L12,20 L12,12.8 L5,8.8 L-2,12.8 L-2,20 L0,20 Z M0,20 L0,26 L5,29 L10,26 L10,20 L12,20 L12,27.2 L5,31.2 L-2,27.2 L-2,20 L0,20 Z' fill='%23ffffff' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
            opacity: 0.3;
            z-index: 1;
            mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 95%);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 95%);
            transition: all 0.5s ease;
        }
        
        body.light-mode .hex-pattern {
             filter: invert(1); /* Invert white hex to black/gray */
             opacity: 0.08; /* Very subtle in light mode */
        }

        /* Vignette & Noise */
        .overlay-texture {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, var(--bg-deep) 120%);
            z-index: 2;
        }
        
        .noise-layer {
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            opacity: 0.5;
            mix-blend-mode: overlay;
            z-index: 3;
        }

        /* --- GLASS PANEL SYSTEM --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: 
                0 8px 32px -4px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 0 var(--glass-shine);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            z-index: 10;
            transition: all 0.5s ease;
        }
        
        body.light-mode .glass-panel {
            box-shadow: 
                0 10px 40px -10px rgba(148, 163, 184, 0.2),
                inset 0 0 0 1px rgba(255, 255, 255, 0.6);
        }

        /* Panel Glow Effect */
        .glass-panel::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at top right, rgba(255,255,255,0.03), transparent 60%);
            pointer-events: none;
        }
        
        body.light-mode .glass-panel::after {
            background: radial-gradient(circle at top right, rgba(255,255,255,0.8), transparent 60%);
        }

        /* --- CARDS & LISTS --- */
        .staff-card {
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid transparent;
            position: relative;
            z-index: 20;
        }

        .staff-card:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px) scale(1.01);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
        }
        
        body.light-mode .staff-card:hover {
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px -10px rgba(148, 163, 184, 0.3);
            border-color: rgba(203, 213, 225, 0.8);
        }

        /* --- HERO SECTION --- */
        .hero-ring-container {
            position: relative;
            padding: 10px;
            z-index: 20;
        }

        .hero-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0%, var(--primary-accent) 20%, transparent 40%, var(--primary-accent) 60%, transparent 100%);
            mask-image: radial-gradient(transparent 62%, black 64%);
            -webkit-mask-image: radial-gradient(transparent 62%, black 64%);
            animation: rotate-ring 12s linear infinite;
            opacity: 0.5;
        }

        .hero-ring-glow {
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            background: var(--primary-accent);
            opacity: 0.15;
            filter: blur(25px);
            animation: pulse-ring 4s ease-in-out infinite alternate;
        }

        @keyframes rotate-ring { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulse-ring { from { opacity: 0.1; transform: scale(0.95); } to { opacity: 0.25; transform: scale(1.05); } }

        /* --- TYPOGRAPHY --- */
        .font-outfit { font-family: 'Outfit', sans-serif; }
        
        /* --- UTILS --- */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        .border-gradient-ready {
            border-left: 3px solid #10b981;
            background: linear-gradient(90deg, rgba(16, 185, 129, 0.05) 0%, transparent 100%);
        }
        
        .border-gradient-busy {
            border-left: 3px solid #eab308;
            background: linear-gradient(90deg, rgba(234, 179, 8, 0.05) 0%, transparent 100%);
        }

    </style>
</head>
<body class="h-screen flex flex-col relative select-none">

    <!-- Advanced Background Layers -->

        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>

        <div class="hex-pattern"></div> <!-- Hexagon Pattern -->

    <!-- Header -->

        <div class="flex items-center gap-5">
            <div>

                    <span class="text-[10px] uppercase tracking-[0.2em] text-muted font-bold">Live Monitor</span>

            </div>
        </div>

        </div>

        <!-- LISTS COLUMN (Right) -->

            <!-- Waiting List -->

        setInterval(updateTime, 1000);
        updateTime();

        function getSortedQueue() { return staffData.filter(s => s.status === 'ready').sort((a, b) => a.lastActive - b.lastActive); }
        function getBusyStaff() { return staffData.filter(s => s.status === 'busy'); }

        // --- Render ---
        function render() {
            const queue = getSortedQueue();
            const busy = getBusyStaff();
            
            // 1. Hero Section
            const nextContainer = document.getElementById('next-agent-display');
            if (queue.length > 0) {
                const nextAgent = queue[0];
                nextContainer.innerHTML = `
                    <div class="relative group cursor-pointer hero-ring-container transform hover:scale-105 transition-transform duration-500" onclick="openModal(${nextAgent.id})">
                        <div class="hero-ring"></div>
                        <div class="hero-ring-glow"></div>
                        <div class="relative w-72 h-72 rounded-full p-2">
                            <img src="${nextAgent.avatar}" class="w-full h-full rounded-full object-cover border-4 border-slate-900 bg-slate-800 shadow-2xl transition-transform duration-700 light-mode:border-white light-mode:bg-slate-100">
                        </div>
                        <div class="absolute bottom-8 right-8 w-16 h-16 bg-green-500 border-[6px] border-slate-900 light-mode:border-white rounded-full flex items-center justify-center shadow-[0_0_20px_#10b981] animate-bounce z-20">
                            <i class="fa-solid fa-check text-white text-2xl"></i>
                        </div>
                    </div>
                    
                    <div class="mt-8 text-center relative z-10">
                        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 mb-5 backdrop-blur-md shadow-[0_0_15px_rgba(6,182,212,0.2)] light-mode:text-cyan-600 light-mode:border-cyan-500/30">
                            <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
                            <span class="text-xs font-bold uppercase tracking-widest">Next Queue</span>
                        </div>
                        <h1 class="text-5xl font-bold text-main mb-2 drop-shadow-2xl font-outfit tracking-tight leading-tight">${nextAgent.name}</h1>
                    </div>

                    <div class="mt-auto mb-2 w-full max-w-xs transform hover:scale-105 transition-transform duration-300 cursor-pointer">
                         <div class="w-full h-14 rounded-2xl bg-gradient-to-r from-green-500 to-teal-400 flex items-center justify-center gap-3 shadow-[0_0_30px_rgba(16,185,129,0.4)] relative overflow-hidden group">
                            <div class="absolute inset-0 bg-white/20 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700"></div>
                            <i class="fa-solid fa-bell text-white text-xl animate-swing"></i>
                            <span class="text-white font-bold text-xl tracking-wide text-shadow-sm">เชิญที่ช่องบริการ</span>
                         </div>
                    </div>
                `;
            } else {
                nextContainer.innerHTML = `
                    <div class="w-64 h-64 rounded-full border-4 border-dashed border-slate-700 flex items-center justify-center opacity-30 animate-pulse light-mode:border-slate-300">
                        <i class="fa-solid fa-mug-hot text-6xl text-slate-500 light-mode:text-slate-400"></i>
                    </div>
                    <h2 class="text-3xl font-bold text-muted mt-8 opacity-50 tracking-wide">No Queue Available</h2>
                `;
            }

            // 2. Waiting List
            const waitingList = queue.slice(1);
            const wContainer = document.getElementById('waiting-list');
            document.getElementById('count-waiting').innerText = waitingList.length;
            wContainer.innerHTML = '';

            if (waitingList.length === 0) {
                wContainer.innerHTML = `<div class="col-span-2 text-center text-muted opacity-40 py-10 italic">ไม่มีคิวรอ</div>`;
            } else {
                waitingList.forEach((staff, i) => {
                    wContainer.innerHTML += `
                        <div onclick="openModal(${staff.id})" class="staff-card border-gradient-ready bg-white/5 rounded-xl p-3 flex items-center gap-4 cursor-pointer group">
                            <div class="w-10 h-10 rounded-lg bg-green-500/10 text-green-500 flex items-center justify-center font-bold text-lg font-outfit border border-green-500/20 shadow-sm group-hover:bg-green-500 group-hover:text-white transition-all duration-300 light-mode:text-green-600">
                                ${i + 1}
                            </div>
                            <img src="${staff.avatar}" class="w-12 h-12 rounded-full bg-slate-800 border border-white/10 object-cover light-mode:bg-white light-mode:border-slate-200 shadow-md">
                            <div class="min-w-0 flex items-center">
                                <h4 class="text-base font-bold text-main truncate group-hover:text-green-400 light-mode:group-hover:text-green-600 transition-colors tracking-tight">${staff.name}</h4>
                            </div>
                        </div>
                    `;
                });
            }

            // 3. Serving List
            const sContainer = document.getElementById('serving-list');
            document.getElementById('count-serving').innerText = busy.length;
            sContainer.innerHTML = '';

            if (busy.length === 0) {
                sContainer.innerHTML = `<div class="col-span-2 text-center text-muted opacity-40 py-10 italic">ว่างงาน</div>`;
            } else {
                busy.forEach(staff => {
                    sContainer.innerHTML += `
                        <div onclick="openModal(${staff.id})" class="staff-card border-gradient-busy bg-white/5 rounded-xl p-3 flex items-center justify-between cursor-pointer group">
                            <div class="flex items-center gap-4 min-w-0">
                                <div class="relative">
                                    <img src="${staff.avatar}" class="w-12 h-12 rounded-full bg-slate-800 border border-white/10 object-cover light-mode:bg-white light-mode:border-slate-200 shadow-md">
                                    <div class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-amber-500 border-2 border-slate-900 rounded-full light-mode:border-white shadow-[0_0_10px_#f59e0b]"></div>
                                </div>
                                <div class="min-w-0">
                                    <h4 class="text-base font-bold text-main truncate group-hover:text-amber-400 light-mode:group-hover:text-amber-600 transition-colors tracking-tight">${staff.name}</h4>
                                    <p class="text-[10px] text-amber-500/80 uppercase font-bold tracking-wider light-mode:text-amber-600/80">Serving</p>
                                </div>
                            </div>
                            <div class="px-3 py-1 rounded bg-amber-500/10 border border-amber-500/20 text-amber-500 font-outfit font-bold text-lg shadow-[0_0_15px_rgba(245,158,11,0.2)] light-mode:text-amber-600">
                                ${staff.customer || '-'}
                            </div>
                        </div>
                    `;
                });
            }
        }

        // --- Modal & Actions ---
        function openModal(id) {
            selectedStaffId = id;
            const staff = staffData.find(s => s.id === id);
            document.getElementById('modal-staff-name').innerText = staff.name;
            document.getElementById('modal-img').src = staff.avatar;
            
            const modal = document.getElementById('action-modal');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); modal.querySelector('div').classList.remove('scale-95'); modal.querySelector('div').classList.add('scale-100'); }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('action-modal');
            modal.classList.add('opacity-0');
            modal.querySelector('div').classList.remove('scale-100');
            modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
            selectedStaffId = null;
        }

        function updateStatus(status) {
            if (!selectedStaffId) return;
            const idx = staffData.findIndex(s => s.id === selectedStaffId);
            if (idx > -1) {
                staffData[idx].status = status;
                staffData[idx].customer = status === 'busy' ? 'A-' + Math.floor(Math.random()*900+100) : (status === 'ready' ? '' : '');
                if (status === 'ready') staffData[idx].lastActive = Date.now();
                closeModal();
                render();
            }
        }

        render();
        document.getElementById('action-modal').addEventListener('click', e => { if(e.target === document.getElementById('action-modal')) closeModal(); });

    </script>
</body>
</html>
